name: DealTough dependency lock validation

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-dependency-lock.yml

permissions:
  contents: read

jobs:
  validate-and-export-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Use current npm resolver
        run: npm install --global npm@11.6.0 && npm --version

      - name: Regenerate lockfile from scratch
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Upload regenerated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealtough-security-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
