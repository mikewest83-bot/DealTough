<script>
  const form = document.getElementById('analyze-form');
  const urlInput = document.getElementById('listing-url');
  const imageInput = document.getElementById('listing-image');
  const checkoutButton = document.getElementById('checkout-btn');
  const copyButton = document.getElementById('copy-btn');

  form?.addEventListener('submit', async (event) => {
    event.preventDefault();

    const listingUrl = urlInput.value.trim();
    const imageFile = imageInput.files?.[0];

    if (!listingUrl && !imageFile) {
      alert('Please paste a listing URL or upload a screenshot.');
      return;
    }

    if (imageFile) {
      const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
      const maxSize = 10 * 1024 * 1024;

      if (!allowedTypes.includes(imageFile.type)) {
        alert('Please upload a PNG, JPG, or WEBP image.');
        return;
      }

      if (imageFile.size > maxSize) {
        alert('The image must be smaller than 10 MB.');
        return;
      }
    }

    const submitButton = form.querySelector('button[type="submit"]');
    const originalText = submitButton.innerHTML;

    try {
      submitButton.disabled = true;
      submitButton.innerHTML = '<span>Analyzing...</span>';

      const formData = new FormData();

      if (listingUrl) {
        formData.append('listingUrl', listingUrl);
      }

      if (imageFile) {
        formData.append('listingImage', imageFile);
      }

      const response = await fetch('/api/analyze', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Unable to analyze this listing.');
      }

      console.log('DealTough result:', data);

      // Next step:
      // Replace the hard-coded values in the results section
      // with values returned in the data object.

      document
        .getElementById('results-container')
        ?.scrollIntoView({ behavior: 'smooth' });

    } catch (error) {
      console.error('Analysis error:', error);
      alert(error.message || 'Something went wrong. Please try again.');
    } finally {
      submitButton.disabled = false;
      submitButton.innerHTML = originalText;
    }
  });

  checkoutButton?.addEventListener('click', async () => {
    const originalText = checkoutButton.textContent;

    try {
      checkoutButton.disabled = true;
      checkoutButton.textContent = 'Loading...';

      const response = await fetch('/api/billing/checkout', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Checkout could not be started.');
      }

      if (!data.url) {
        throw new Error('Checkout URL was not returned.');
      }

      window.location.href = data.url;

    } catch (error) {
      console.error('Checkout error:', error);
      alert(error.message || 'Unable to open checkout.');
      checkoutButton.disabled = false;
      checkoutButton.textContent = originalText;
    }
  });

  copyButton?.addEventListener('click', async () => {
    const scriptText = document.querySelector(
      '#copy-btn + div'
    )?.textContent?.trim();

    if (!scriptText) {
      return;
    }

    try {
      await navigator.clipboard.writeText(scriptText);
      copyButton.textContent = 'Copied!';

      setTimeout(() => {
        copyButton.textContent = 'Copy Script';
      }, 1500);
    } catch (error) {
      console.error('Copy error:', error);
      alert('The message could not be copied.');
    }
  });
</script>
