<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealTough — Know before you buy</title>
<style>
  :root {
    --bg: #0e1116; --panel: #171c24; --panel2: #1e2530; --line: #2a3342;
    --text: #e6ebf2; --dim: #8a95a5; --accent: #4f8ef7;
    --good: #3ecf8e; --warn: #f5b942; --bad: #f4645f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  h1 { font-size: 26px; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .tag { color: var(--dim); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--dim); margin: 12px 0 4px; }
  textarea, select, input[type=password] {
    width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font: inherit;
  }
  textarea { min-height: 140px; resize: vertical; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 200px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 11px 22px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 14px;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--dim); padding: 6px 12px; font-size: 13px; margin-top: 8px; }
  .err { color: var(--bad); margin-top: 10px; font-size: 14px; white-space: pre-wrap; }
  .muted { color: var(--dim); font-size: 13px; }
  /* result */
  .headline { text-align: center; padding: 4px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .verdict-big { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .scoreline { font-size: 15px; font-weight: 600; margin-top: 4px; }
  .scoreline b { font-size: 17px; }
  .sub { color: var(--dim); font-size: 13px; margin-top: 8px; }
  .prices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .price { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .price.hero { border-color: var(--accent); }
  .price b { display: block; font-size: 18px; }
  .price span { font-size: 12px; color: var(--dim); }
  .more-numbers { margin-top: 10px; }
  .bars { margin-top: 16px; }
  .bar { display: grid; grid-template-columns: 92px 1fr 46px; gap: 8px; align-items: center; margin: 5px 0; font-size: 13px; }
  .track { background: var(--panel2); border-radius: 6px; height: 8px; overflow: hidden; }
  .fill { background: var(--accent); height: 100%; }
  ul { margin: 6px 0 0 18px; }
  li { margin: 3px 0; }
  .msg { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 8px; font-size: 14px; white-space: pre-wrap; }
  .warnings li { color: var(--warn); }
  .risks li { color: var(--bad); }
  h3 { font-size: 15px; margin-top: 18px; }
  /* history */
  .deal-item { display: flex; justify-content: space-between; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .deal-item:hover { background: var(--panel2); }
  .deal-item:last-child { border-bottom: 0; }
  .pill { border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; align-self: center; }
  .hidden { display: none; }
  .tabs { display: flex; gap: 6px; margin-bottom: 4px; }
  .tab {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; margin-top: 0;
  }
  .tab.active { background: var(--panel2); color: var(--text); border-color: var(--accent); }
  input[type=text], input[type=number] {
    width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font: inherit;
  }
  .dropzone {
    border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px;
  }
  .dropzone.drag { border-color: var(--accent); background: var(--panel2); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .thumb { position: relative; width: 64px; height: 64px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; padding: 0; margin: 0;
    border-radius: 50%; background: rgba(0,0,0,0.7); font-size: 12px; line-height: 1; color: #fff;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Deal<span>Tough</span></h1>
    <div class="tag">Know the real value. Negotiate with confidence.</div>
  </header>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabPaste">Paste listing</button>
      <button class="tab" id="tabManual">Manual entry</button>
    </div>

    <div id="pasteForm">
      <label for="rawText">Paste the listing</label>
      <textarea id="rawText" placeholder="Copy the marketplace listing here — title, price, description, anything the seller wrote."></textarea>
      <div class="row">
        <div>
          <label for="category">Category</label>
          <select id="category">
            <option value="">Auto-detect</option>
            <option value="vehicle">Vehicle</option>
            <option value="electronics">Electronics</option>
            <option value="tools">Tools</option>
            <option value="furniture">Furniture</option>
            <option value="outdoor_equipment">Outdoor equipment</option>
          </select>
        </div>
        <div>
          <label for="photos">Photos (optional)</label>
          <div class="dropzone" id="dropzone" tabindex="0">
            <input type="file" id="photos" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
            <div class="muted" style="margin-top:6px">or paste (Ctrl/Cmd+V) — screenshots work too</div>
          </div>
          <div class="thumbs" id="thumbs"></div>
        </div>
      </div>
    </div>

    <div id="manualForm" class="hidden">
      <div class="row">
        <div>
          <label for="mTitle">What is it?</label>
          <input type="text" id="mTitle" placeholder="e.g. DeWalt 20V drill combo kit">
        </div>
        <div>
          <label for="mCategory">Category</label>
          <select id="mCategory">
            <option value="vehicle">Vehicle</option>
            <option value="electronics">Electronics</option>
            <option value="tools" selected>Tools</option>
            <option value="furniture">Furniture</option>
            <option value="outdoor_equipment">Outdoor equipment</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="mPrice">Asking price ($)</label>
          <input type="number" id="mPrice" min="1" placeholder="250">
        </div>
        <div>
          <label for="mCondition">Condition</label>
          <select id="mCondition">
            <option value="unknown">Unknown</option>
            <option value="new">New</option>
            <option value="like_new">Like new</option>
            <option value="good">Good</option>
            <option value="fair">Fair</option>
            <option value="poor">Poor</option>
          </select>
        </div>
      </div>
      <label for="mComps">Similar prices you've seen ($, comma-separated)</label>
      <input type="text" id="mComps" placeholder="e.g. 300, 320, 280">
      <label style="margin-top:8px"><input type="checkbox" id="mSold" style="width:auto;margin-right:6px">These are prices items actually sold for</label>
      <div class="row">
        <div>
          <label for="mDays">Days listed (optional)</label>
          <input type="number" id="mDays" min="0" placeholder="0">
        </div>
        <div>
          <label for="mExtra">Expected extra costs $ (repairs, parts — optional)</label>
          <input type="number" id="mExtra" min="0" placeholder="0">
        </div>
      </div>
      <div class="muted" style="margin-top:8px">Manual analyses run instantly and free, but aren't saved to the DealVault.</div>
    </div>

    <button id="analyze">Analyze this deal</button>
    <div class="err hidden" id="error"></div>
  </div>

  <div class="card hidden" id="result"></div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">DealVault — past analyses</h3>
      <button class="ghost" id="refreshHistory">Refresh</button>
    </div>
    <div id="history" class="muted" style="margin-top:8px">Loading…</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const JSON_HEADERS = { "Content-Type": "application/json" };

function verdictColor(verdict) {
  if (/Walk Away|High Risk/.test(verdict)) return "var(--bad)";
  if (/Fair/.test(verdict)) return "var(--warn)";
  return "var(--good)";
}
const money = (n) => "$" + Number(n).toLocaleString();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// Photos can arrive via the file picker (phone camera/library or computer
// file browser), pasted from the clipboard (Ctrl/Cmd+V — screenshots too),
// or dragged onto the dropzone. All three funnel into this one list.
let attachedPhotos = []; // { base64, mediaType, dataUrl }

function fileToPhoto(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 4 * 1024 * 1024) {
      reject(new Error(`"${file.name || "That image"}" is over 4 MB — use a smaller photo.`));
      return;
    }
    const r = new FileReader();
    r.onload = () => resolve({ base64: r.result.split(",")[1], mediaType: file.type, dataUrl: r.result });
    r.onerror = () => reject(new Error("Couldn't read that image."));
    r.readAsDataURL(file);
  });
}

async function addPhotoFiles(fileList) {
  const files = [...fileList].filter((f) => f.type.startsWith("image/"));
  for (const file of files) {
    try {
      attachedPhotos.push(await fileToPhoto(file));
    } catch (e) {
      showError(e.message);
    }
  }
  renderThumbs();
}

function renderThumbs() {
  $("thumbs").innerHTML = attachedPhotos.map((p, i) =>
    `<div class="thumb"><img src="${p.dataUrl}" alt=""><button type="button" data-i="${i}" aria-label="Remove photo">×</button></div>`
  ).join("");
  [...document.querySelectorAll(".thumb button")].forEach((btn) => {
    btn.onclick = () => { attachedPhotos.splice(Number(btn.dataset.i), 1); renderThumbs(); };
  });
}

$("photos").onchange = () => { addPhotoFiles($("photos").files); $("photos").value = ""; };

const dropzone = $("dropzone");
["dragover", "dragenter"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("drag"); }));
["dragleave", "drop"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("drag"); }));
dropzone.addEventListener("drop", (e) => {
  if (e.dataTransfer?.files?.length) addPhotoFiles(e.dataTransfer.files);
});

document.addEventListener("paste", (e) => {
  if (mode !== "paste") return;
  const items = [...(e.clipboardData?.items ?? [])].filter(
    (item) => item.kind === "file" && item.type.startsWith("image/"),
  );
  if (!items.length) return;
  e.preventDefault();
  const files = items.map((item) => item.getAsFile()).filter(Boolean);
  addPhotoFiles(files);
});

const BAR_MAX = { value: 35, risk: 20, trueCost: 15, negotiation: 10, market: 10, confidence: 10 };
const BAR_LABEL = { value: "Value", risk: "Risk", trueCost: "True cost", negotiation: "Negotiation", market: "Market", confidence: "Confidence" };

function renderResult(data) {
  const r = data.recommendation;
  const bars = Object.keys(BAR_MAX).map((k) => {
    const v = r.breakdown[k] ?? 0, max = BAR_MAX[k];
    return `<div class="bar"><span>${BAR_LABEL[k]}</span><div class="track"><div class="fill" style="width:${(v / max) * 100}%"></div></div><span>${v}/${max}</span></div>`;
  }).join("");

  const askingPrice = data.extracted.askingPrice;
  const color = verdictColor(r.verdict);

  $("result").innerHTML = `
    <div class="headline">
      <div class="verdict-big" style="color:${color}">${esc(r.verdict)}</div>
      <div class="scoreline" style="color:${color}">Deal Score <b>${r.dealScore}</b>/100</div>
      <div class="sub">${esc(data.extracted.title)} · risk: ${esc(r.riskLevel)} · confidence ${r.confidencePercent}%
        · comps: ${data.comparablesCount} (${esc(data.comparablesSource)})</div>
    </div>
    <div class="prices">
      <div class="price hero"><span>Fair market value</span><b>${money(r.fairMarketValue)}</b></div>
      <div class="price hero"><span>Asking price</span><b>${askingPrice != null ? money(askingPrice) : "—"}</b></div>
      <div class="price hero"><span>Estimated savings</span><b>${money(r.estimatedSavings)}</b></div>
      <div class="price hero"><span>Recommended offer</span><b>${money(r.openingOffer)}</b></div>
      <div class="price hero"><span>Walk-away price</span><b>${money(r.walkAwayPrice)}</b></div>
    </div>
    <div class="prices more-numbers">
      <div class="price"><span>Target price</span><b>${money(r.targetPrice)}</b></div>
      <div class="price"><span>True cost</span><b>${money(r.trueCost)}</b></div>
    </div>
    <div class="bars">${bars}</div>
    <h3>Why</h3><ul>${r.reasons.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Top risks</h3><ul class="risks">${r.topRisks.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Ask the seller</h3><ul>${r.sellerQuestions.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Suggested message</h3>
    <div class="msg" id="negMsg">${esc(r.negotiationMessage)}</div>
    <button class="ghost" id="copyMsg">Copy message</button>
    ${data.warnings?.length ? `<h3>Notes</h3><ul class="warnings">${data.warnings.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${r.assumptions?.length ? `<ul class="muted" style="margin-top:10px">${r.assumptions.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
  `;
  $("result").classList.remove("hidden");
  $("copyMsg").onclick = () => navigator.clipboard.writeText(r.negotiationMessage);
  $("result").scrollIntoView({ behavior: "smooth" });
}

let mode = "paste";
function setMode(next) {
  mode = next;
  $("tabPaste").classList.toggle("active", next === "paste");
  $("tabManual").classList.toggle("active", next === "manual");
  $("pasteForm").classList.toggle("hidden", next !== "paste");
  $("manualForm").classList.toggle("hidden", next !== "manual");
  $("error").classList.add("hidden");
}
$("tabPaste").onclick = () => setMode("paste");
$("tabManual").onclick = () => setMode("manual");

async function analyzePaste() {
  const rawText = $("rawText").value.trim();
  if (!rawText) throw new Error("Paste a listing first.");
  const body = { rawText };
  if (attachedPhotos.length) {
    body.photos = attachedPhotos.map(({ base64, mediaType }) => ({ base64, mediaType }));
  }
  if ($("category").value) body.categoryOverride = $("category").value;
  const res = await fetch("/api/v1/deals/from-listing", { method: "POST", headers: JSON_HEADERS, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  renderResult(data);
  loadHistory();
}

async function analyzeManual() {
  const title = $("mTitle").value.trim();
  if (!title) throw new Error("Enter what the item is.");
  const askingPrice = Number($("mPrice").value);
  if (!askingPrice || askingPrice <= 0) throw new Error("Enter the asking price.");
  const sold = $("mSold").checked;
  const comparables = $("mComps").value
    .split(",").map((s) => Number(s.trim())).filter((n) => Number.isFinite(n) && n > 0)
    .map((price) => ({ price, sold }));
  const body = {
    category: $("mCategory").value,
    title,
    askingPrice,
    condition: $("mCondition").value,
    comparables,
  };
  const days = Number($("mDays").value);
  if (days > 0) body.daysListed = days;
  const extra = Number($("mExtra").value);
  if (extra > 0) body.hiddenCosts = [{ label: "Expected extra costs", amount: extra }];
  const res = await fetch("/api/v1/deals/analyze", { method: "POST", headers: JSON_HEADERS, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  renderResult({
    recommendation: data,
    extracted: { title, askingPrice },
    comparablesCount: comparables.length,
    comparablesSource: "manual",
    warnings: [],
  });
}

$("analyze").onclick = async () => {
  $("error").classList.add("hidden");
  $("analyze").disabled = true;
  $("analyze").textContent = "Analyzing…";
  try {
    if (mode === "paste") await analyzePaste();
    else await analyzeManual();
  } catch (e) {
    showError(e.message);
  } finally {
    $("analyze").disabled = false;
    $("analyze").textContent = "Analyze this deal";
  }
};

function showError(msg) {
  $("error").textContent = msg;
  $("error").classList.remove("hidden");
}

async function loadHistory() {
  try {
    const res = await fetch("/api/v1/deals?limit=15");
    if (res.status === 503) { $("history").textContent = "Persistence is not configured."; return; }
    if (!res.ok) throw new Error();
    const deals = await res.json();
    if (!deals.length) { $("history").textContent = "No deals analyzed yet."; return; }
    $("history").innerHTML = deals.map((d) => {
      const r = d.recommendation || {};
      return `<div class="deal-item" data-id="${esc(d.id)}">
        <div><b>${esc(d.title)}</b><div class="muted">${esc(d.category)} · asking ${money(d.askingPrice)} · ${new Date(d.createdAt).toLocaleString()}</div></div>
        <span class="pill" style="background:${verdictColor(r.verdict || "")};color:#0e1116">${r.dealScore ?? "?"} · ${esc(r.verdict || "")}</span>
      </div>`;
    }).join("");
    [...document.querySelectorAll(".deal-item")].forEach((el) => {
      el.onclick = async () => {
        const res = await fetch(`/api/v1/deals/${el.dataset.id}`);
        if (!res.ok) return;
        const d = await res.json();
        renderResult({
          recommendation: d.recommendation,
          extracted: { title: d.title, askingPrice: d.askingPrice },
          comparablesCount: "–",
          comparablesSource: "saved",
          warnings: [],
        });
      };
    });
  } catch {
    $("history").textContent = "Couldn't load history.";
  }
}
loadHistory();
</script>
</body>
</html>
